<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b1d"><title>Drift Circuit — Planet Geek</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#17285a,#070b1d 65%);color:#eef6ff;font-family:system-ui,Arial;min-height:100vh;display:grid;place-items:center;padding:14px}main{width:min(980px,100%);text-align:center}h1{font-size:clamp(28px,6vw,54px);margin:8px;color:#ffca68;text-shadow:0 0 22px #ffca6866}p{color:#c8d8f4}.hud{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px}.pill{background:#101d3b;border:1px solid #ffca6866;border-radius:14px;padding:9px 15px}canvas{width:100%;max-width:900px;height:auto;aspect-ratio:16/9;background:#081127;border:1px solid #ffca6888;border-radius:18px;box-shadow:0 0 35px #ffca6822;touch-action:none}button{background:linear-gradient(120deg,#ffca68,#956aff);border:0;color:#071020;font-weight:900;border-radius:12px;padding:12px 18px;margin:5px;font-size:15px;touch-action:manipulation}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}a{color:#cfeaff}.hint{font-size:13px}@media(max-width:600px){body{padding:8px}canvas{border-radius:10px}}
</style><link rel="stylesheet" href="planet-geek-redesign.css">
</head><body><main><a href="jeux.html">← Retour aux jeux</a><h1>Drift Circuit</h1><p>Évite le trafic et tiens le plus longtemps possible sur la route néon.</p><div class="hud"><div class="pill">Score : <b id="score">0</b></div><div class="pill">Record : <b id="best">0</b></div><div class="pill" id="status">Prêt ?</div></div><canvas id="game" width="900" height="506"></canvas><div class="controls"><button id="left">◀ GAUCHE</button><button id="action">JOUER / ACTION</button><button id="right">DROITE ▶</button></div><p class="hint">Utilise A/D, les flèches ou les boutons GAUCHE/DROITE.</p></main><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let score=0,best=+(localStorage.getItem('pg_drift_circuit_best')||0),running=false,keys={},last=0; $('best').textContent=best;
function saveScore(v){score=v;$('score').textContent=v;if(v>best){best=v;$('best').textContent=v;localStorage.setItem('pg_drift_circuit_best',best)}}
function start(){running=true;score=0;saveScore(0);$('status').textContent='En cours';resetGame()}
$('action').onclick=()=>running?actionGame():start();$('left').onpointerdown=()=>keys.left=true;$('left').onpointerup=$('left').onpointerleave=()=>keys.left=false;$('right').onpointerdown=()=>keys.right=true;$('right').onpointerup=$('right').onpointerleave=()=>keys.right=false;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();running?actionGame():start()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function end(){running=false;$('status').textContent='Terminé — rejoue !'}
function draw(){requestAnimationFrame(draw);let dt=Math.min((performance.now()-last)/16.67,2);last=performance.now();ctx.clearRect(0,0,900,506);
ctx.fillStyle='#101d3b';ctx.fillRect(0,0,900,506);ctx.fillStyle='#26375c';ctx.fillRect(230,0,440,506);ctx.strokeStyle='#d9eaff';ctx.setLineDash([28,22]);ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(450,0);ctx.lineTo(450,506);ctx.stroke();ctx.setLineDash([]);
if(!window.drift)window.drift={x:435,traffic:[],tick:0};let d=window.drift;
if(running){d.tick+=dt;if(keys.left||keys.a)d.x-=6*dt;if(keys.right||keys.d)d.x+=6*dt;d.x=Math.max(255,Math.min(625,d.x));if(d.tick%48<dt)d.traffic.push({x:270+Math.random()*330,y:-70});d.traffic.forEach(t=>t.y+=7*dt);d.traffic=d.traffic.filter(t=>t.y<560);d.traffic.forEach(t=>{if(Math.abs(t.x-d.x)<42&&t.y>380&&t.y<480)end()});saveScore(Math.floor(d.tick/5))}
ctx.fillStyle='#42eaff';ctx.fillRect(d.x,410,42,72);d.traffic.forEach(t=>{ctx.fillStyle='#ff5c9d';ctx.fillRect(t.x, t.y,42,72)});ctx.fillStyle='#fff';ctx.font='22px system-ui';ctx.fillText('DRIFT CIRCUIT',25,38);
}
function resetGame(){}
function actionGame(){}
draw();
</script><script src="planet-geek-redesign.js" defer></script>
</body></html>
